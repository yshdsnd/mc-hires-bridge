name: Build Windows ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Win32
        run: cmake -S . -B build-Win32 -G "Visual Studio 17 2022" -A Win32

      - name: Build launcher and tests
        run: cmake --build build-Win32 --config Release --target mc_hires_bridge bridge_status_tests

      - name: Check output-mode parser and labels
        run: ./build-Win32/Release/bridge_status_tests.exe

      - name: Create minimal distribution ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build-Win32 --config Release --prefix 'package/MC HiRes Bridge'
          $root = (Resolve-Path 'package/MC HiRes Bridge').Path
          $expected = @('README.md', 'MC HiRes Bridge.exe', 'flac24_override.dll', 'LICENSE', 'licenses/MinHook.txt')
          $actual = @(Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          })
          if (Compare-Object $expected $actual) { throw 'Unexpected distribution contents' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath $root -DestinationPath 'dist/mc-hires-bridge-windows-x86.zip' -CompressionLevel Optimal -Force

      - name: Upload distribution ZIP
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/mc-hires-bridge-windows-x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Link ZIP in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "[Download mc-hires-bridge-windows-x86.zip]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY

      # gh run download extracts archived artifacts. Keep the distribution ZIP
      # inside a separate archive for job-to-job transfer on release builds.
      - name: Transfer ZIP to release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/mc-hires-bridge-windows-x86.zip
          archive: true
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Inspect gh exit codes explicitly, including the expected missing release.
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'Release tag must be a version such as v0.1.0'
          }
          gh run download $env:BUILD_RUN_ID --name release-package --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download build artifact' }
          $archives = @(Get-ChildItem -LiteralPath artifacts -Recurse -File -Filter 'mc-hires-bridge-windows-x86.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one distribution ZIP' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $assetName = "mc-hires-bridge-$env:RELEASE_TAG-windows-x86.zip"
          $assetPath = Join-Path release-assets $assetName
          Copy-Item -LiteralPath $archives[0].FullName -Destination $assetPath
          $checksum = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $assetName" | Set-Content -LiteralPath "$assetPath.sha256" -Encoding ascii

          $existing = gh release view $env:RELEASE_TAG --json isDraft | Out-String
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              throw 'Release is already published; refusing to replace its assets'
            }
          } else {
            $notesPath = "docs/releases/$env:RELEASE_TAG.md"
            $notesArgs = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
            gh release create $env:RELEASE_TAG --verify-tag --draft --title $env:RELEASE_TAG @notesArgs
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }
          gh release upload $env:RELEASE_TAG $assetPath "$assetPath.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
          $releaseUrl = gh release view $env:RELEASE_TAG --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to verify draft release' }
          "[Draft release $env:RELEASE_TAG]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
